<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1A362D">
  <title>Seva Dental Clinic</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'calm-blue': '#F0EBE1', // Soft beige
            'gentle-green': '#1A362D', // Forest green
            'trustworthy-white': '#F9F8F6', // Warm cream
            'pure-white': '#FFFFFF',
            'warm-coral': '#D4AF37', // Champagne gold
            'primary-text': '#1A1A1A',
            'secondary-text': '#5C5C5C',
          },
          fontFamily: {
            heading: ['"Playfair Display"', 'serif'],
            body: ['Inter', 'sans-serif'],
          },
           keyframes: {
            'fade-in-up': {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            'slow-bounce': {
              '0%, 100%': {
                transform: 'translateY(-15%)',
                animationTimingFunction: 'cubic-bezier(0.8, 0, 1, 1)',
              },
              '50%': {
                transform: 'translateY(0)',
                animationTimingFunction: 'cubic-bezier(0, 0, 0.2, 1)',
              },
            },
            'spin': {
              'from': { transform: 'rotate(0deg)' },
              'to': { transform: 'rotate(360deg)' },
            },
          },
          animation: {
            'fade-in-up': 'fade-in-up 0.8s ease-out forwards',
            'slow-bounce': 'slow-bounce 3s infinite',
            'spin': 'spin 1s linear infinite',
          },
        },
      },
    }
  </script>
<style>
  /* Custom Scrollbar for a themed look */
  ::-webkit-scrollbar {
    width: 8px;
  }
  ::-webkit-scrollbar-track {
    background: #F9F8F6; 
  }
  ::-webkit-scrollbar-thumb {
    background-color: #D4AF37; 
    border-radius: 10px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background-color: #1A362D; 
  }

  /* Custom styles for details/summary accordion */
  details > summary {
    list-style: none;
  }
  details > summary::-webkit-details-marker {
    display: none;
  }

  /* Hide default cursor for custom cursor */
  @media (pointer: fine) {
    body, a, button, select {
      cursor: none !important;
    }
    input, textarea {
      cursor: text !important;
    }
  }

  /* Animated underline for nav links */
  .nav-link {
    position: relative;
    padding-bottom: 4px; /* Space for the underline */
  }

  .nav-link::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 1px;
    background-color: #D4AF37; /* champagne gold */
    transform: scaleX(0);
    transform-origin: center;
    transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
  }

  .nav-link:hover::after,
  .nav-link.active::after {
    transform: scaleX(1);
  }

  /* Lenis smooth scrolling */
  html.lenis {
    height: auto;
  }
  .lenis.lenis-smooth {
    scroll-behavior: auto !important;
  }
  .lenis.lenis-smooth [data-lenis-prevent] {
    overscroll-behavior: contain;
  }
  .lenis.lenis-stopped {
    overflow: hidden;
  }
  .lenis.lenis-scrolling iframe {
    pointer-events: none;
  }

  /* Markdown Body Styles */
  .markdown-body ul {
    list-style-type: disc;
    margin-left: 1.5rem;
    margin-top: 0.5rem;
    margin-bottom: 0.5rem;
  }
  .markdown-body li {
    margin-bottom: 0.25rem;
  }
  .markdown-body p {
    margin-bottom: 0.5rem;
  }
  .markdown-body strong {
    font-weight: 600;
    color: #1A362D; /* gentle-green */
  }
</style>
</head>
<body class="font-body bg-trustworthy-white text-primary-text">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
